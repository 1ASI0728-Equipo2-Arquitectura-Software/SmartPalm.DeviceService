services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartpalm_device
      POSTGRES_USER: smartpalm_device
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpalm_device -d smartpalm_device"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - device-postgres:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["isolated"]
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  device-api:
    build:
      context: .
    profiles: ["api"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DeviceDatabase: Host=postgres;Port=5432;Database=smartpalm_device;Username=smartpalm_device;Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: smartpalm.identity
      Jwt__Audience: smartpalm.clients
      Jwt__Key: ${JWT_KEY}
      RabbitMq__Enabled: "true"
      RabbitMq__Uri: ${RABBITMQ_URI:-amqp://guest:guest@host.docker.internal:5672/}
    ports:
      - "${DEVICE_API_PORT:-5103}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  device-postgres:
